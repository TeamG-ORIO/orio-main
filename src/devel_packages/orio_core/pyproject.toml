# Packaging/install is handled by catkin (setup.py + catkin_python_setup).
# This file only configures the standalone pytest run:
#   cd src/devel_packages/orio_core && python3 -m pytest

[tool.pytest.ini_options]
# Make `from orio_core import ...` importable without an install.
pythonpath = ["."]
testpaths = ["tests"]
