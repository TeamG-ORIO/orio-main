# Grasp planning configuration for the pick-and-place path.
# Loaded by orio_perception/launch/perception.launch.

# Which backend /compute_grasps uses: suction | dexnet | classical
#   suction - the orio-grasping height-map network (orio_bringup/docker/run_suction.sh)
#   dexnet  - DexNet 4.0 FC-GQCNN (orio_bringup/docker/run_dexnet.sh)
grasp_backend: classical

dexnet:
  service: /dexnet_grasp_planner/plan_grasp
  service_timeout: 30.0        # s to wait for the planner at startup

  # Bin mask: the static crop AND this depth band. Excludes the bin floor and
  # anything above the rim. Tune both at bringup against a loaded bin.
  bin_depth_min: 0.60          # m
  bin_depth_max: 1.20          # m

  min_q_value: 0.30            # reject grasps below this confidence
  # NOTE: the threshold is enforced by the planner container, which takes it from
  # DEXNET_MIN_Q_VALUE (run_dexnet.sh) or run_dexnet_pnp_single.sh --min-q. This
  # entry is not read by the perception node.

  # Reject grasps whose approach axis deviates further than this from vertical.
  # Set to 0 to accept only vertical grasps (parity with the classical path).
  # pick-place-label.py gates on this too, via its own ~max_tilt_deg param.
  max_tilt_deg: 45.0

  # Item mask: narrow the depth band to (GroundingDINO+SAM item pixels) OR (pixels
  # clearly above the table), so the bare table is never a grasp candidate. Thin
  # items come in through the prompt, tall or piled items through height.
  # enabled: false restores the depth-band-only mask and skips loading the models.
  item_mask:
    enabled: true
    prompt: "medical item on black table"
    erode_px: 3                # shrink detected items so grasps stay off their edges
    above_table_min: 0.015     # m above the fitted table plane to count as an item

  # Approach axis from a plane fitted to raw depth under the cup, replacing
  # DexNet's per-pixel normal.
  #   off      - DexNet's axis, untouched (previous behaviour)
  #   shadow   - log plane vs DexNet tilt, still execute DexNet's axis
  #   override - execute the plane's axis
  plane_fit:
    mode: override
    radius: 0.03               # m, patch radius around the grasp (~1.5x cup radius)
    min_inlier_frac: 0.7       # below this the patch is not treated as a plane
    fallback: vertical         # override only, when no plane is found: vertical | dexnet

  # Motion offsets along the grasp normal, replacing the world-Z offsets used by
  # the classical path. Mirror these into pick-place-label.py's ~pre_grasp_dist
  # and ~contact_dist, which own the motion side.
  pre_grasp_dist: 0.10         # m
  contact_dist: 0.05           # m

  # Lateral XY correction in the world frame. The classical path's 0.015 / -0.05 is a
  # hand-tuned calibration residual, NOT a two-cup offset (grasp_solver already returns
  # the cup midpoint). Since the residual belongs to the camera calibration and gripper
  # rather than the algorithm, DexNet probably needs the same values - 0.0 is only a
  # safe dry-run default. Resolve on hardware before trusting any A/B result.
  # For run_dexnet_pnp_single.sh the correction is applied in the pick loop instead
  # (--offset-x/--offset-y, or ORIO_PNP_OFFSET_X/Y), after the raw pose is published.
  # Leave these at 0 when using that, or the offset is applied twice.
  offset_x: 0.0
  offset_y: 0.0

# The suction network's planner. Same service contract and the same keys as dexnet:
# above (the shared code reads whichever section is active), minus the bin depth band
# and item mask: it plans from the full depth frame, which it turns into the top-down
# height map it was trained on, and needs no segmask. Its score threshold is set on the
# planner (SUCTION_MIN_SCORE, run_dexnet_pnp_single.sh --min-q).
suction:
  service: /suction_grasp_planner/plan_grasp
  service_timeout: 30.0        # s to wait for the planner at startup

  # The network's training labels give zero access beyond 35 deg of tilt.
  max_tilt_deg: 35.0

  # The network already uses a plane fitted over a 16 mm disc of the height map, and
  # its seal/hold scores assume that normal, so the raw-depth plane fit is off by default.
  plane_fit:
    mode: "off"                # off | shadow | override, as for dexnet
    radius: 0.03
    min_inlier_frac: 0.7
    fallback: vertical

  pre_grasp_dist: 0.10         # m
  contact_dist: 0.05           # m

  # Lateral XY correction in the world frame; see dexnet.offset_x/y.
  offset_x: 0.0
  offset_y: 0.0

classical:
  offset_x: 0.015              # existing hardcoded values, preserved
  offset_y: -0.05

camera:
  # Read intrinsics from camera_info rather than the hardcoded PrimeSense defaults.
  use_camera_info: true
  info_topic: /camera/rgb/camera_info
  info_timeout: 5.0            # s; falls back to PrimeSense defaults on timeout
  # Used only when use_camera_info is false.
  # manual_intrinsics: {fx: 525.0, fy: 525.0, cx: 319.5, cy: 239.5}
