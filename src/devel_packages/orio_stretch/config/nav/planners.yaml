# move_base planner selection + tuning for Stretch RE1 (differential drive, 0.3 m/s top speed).
base_global_planner: global_planner/GlobalPlanner
base_local_planner: dwa_local_planner/DWAPlannerROS
controller_frequency: 8.0
planner_frequency: 0.5         # re-plan every 2 s so newly seen obstacles change the route
planner_patience: 8.0
controller_patience: 10.0
max_planning_retries: 5
oscillation_timeout: 15.0
oscillation_distance: 0.2
conservative_reset_dist: 2.0
clearing_rotation_allowed: true
recovery_behavior_enabled: true
shutdown_costmaps: false

GlobalPlanner:
  allow_unknown: false         # never route through space no sensor has seen
  default_tolerance: 0.25
  use_dijkstra: true
  use_quadratic: true
  use_grid_path: false
  old_navfn_behavior: false
  lethal_cost: 253
  neutral_cost: 66
  cost_factor: 0.55            # stay away from walls without hugging the centre line
  publish_potential: false
  orientation_mode: 0
  outline_map: false

DWAPlannerROS:
  # velocity limits (base top speed is 0.30 m/s / 1.87 rad/s; keep a margin)
  max_vel_trans: 0.25
  min_vel_trans: 0.05
  max_vel_x: 0.25
  min_vel_x: -0.05             # tiny reverse allowed to un-stick, planner still prefers forward
  max_vel_y: 0.0
  min_vel_y: 0.0
  max_vel_theta: 0.8
  min_vel_theta: 0.25          # below this the base does not overcome friction
  acc_lim_x: 0.5
  acc_lim_y: 0.0
  acc_lim_theta: 1.5
  acc_lim_trans: 0.5
  # goal tolerance
  xy_goal_tolerance: 0.12
  yaw_goal_tolerance: 0.10
  latch_xy_goal_tolerance: true
  # forward simulation
  sim_time: 2.0
  sim_granularity: 0.025
  angular_sim_granularity: 0.05
  vx_samples: 8
  vy_samples: 0
  vth_samples: 20
  # trajectory scoring
  path_distance_bias: 32.0
  goal_distance_bias: 20.0
  occdist_scale: 0.05
  forward_point_distance: 0.25
  stop_time_buffer: 0.3
  scaling_speed: 0.25
  max_scaling_factor: 0.2
  twirling_scale: 0.0
  # misc
  oscillation_reset_dist: 0.05
  prune_plan: true
  publish_cost_grid_pc: false
  publish_traj_pc: false
