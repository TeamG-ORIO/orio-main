local_costmap:
  global_frame: odom           # smooth (no AMCL jumps) for the local planner
  robot_base_frame: base_link
  update_frequency: 5.0
  publish_frequency: 2.0
  static_map: false
  rolling_window: true
  width: 5.0
  height: 5.0
  resolution: 0.05
  track_unknown_space: false
  plugins:
    - {name: obstacles_laser,  type: "costmap_2d::ObstacleLayer"}
    - {name: obstacles_depth,  type: "costmap_2d::VoxelLayer"}
    - {name: inflation,        type: "costmap_2d::InflationLayer"}
